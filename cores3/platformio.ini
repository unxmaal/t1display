[platformio]
default_envs = m5stack-cores3
src_dir = src

[env:m5stack-cores3]
platform = espressif32 @ 7.1.3
board = m5stack-cores3
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified @ 0.2.23
    bblanchon/ArduinoJson @ 7.4.3
lib_extra_dirs = ../lib
build_flags =
    -DARDUINOJSON_USE_LONG_LONG=1
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Wduplicated-branches
    -Wshadow
    -Wformat=2
    -Werror
build_unflags = -std=gnu++11
extra_scripts = pre:load_env.py

[env:ota]
extends = env:m5stack-cores3
upload_protocol = espota
upload_port = ${sysenv.T1DISPLAY_HOST}
upload_flags = --auth=${sysenv.T1DISPLAY_OTA_PASSWORD}
